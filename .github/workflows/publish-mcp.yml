name: Publish to MCP Registry

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Run tests
        run: make test

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: make build build-static VERSION="$VERSION"

      - name: Compute SHA256
        run: |
          SHA=$(openssl dgst -sha256 bin/linux-mcp | awk '{print $2}')
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" --arg sha "$SHA" '.version = $v | .packages[0].version = $v | .packages[0].fileSha256 = $sha' server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
